<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KK Tire Cambodia - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Battambang', sans-serif; }
        body { background-color: #1b263b; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box, .admin-container { background: #22303c; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { font-size: 18px; margin-bottom: 15px; text-align: center; color: #ffc107; }
        .form-control { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #415a77; background: #1b263b; color: #fff; border-radius: 6px; font-family: 'Battambang', sans-serif; font-size: 13px; }
        .btn { width: 100%; background: #ffc107; color: #1b263b; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; font-family: 'Battambang', sans-serif; }
        .admin-container { display: none; }
        .card { background: #1b263b; border: 1px solid #415a77; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .card h3 { font-size: 15px; margin-bottom: 10px; color: #ffc107; }
        .error-msg { color: #ff6b6b; font-size: 12px; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- ប្រអប់ផ្ទៀងផ្ទាត់កូដសម្ងាត់ (PIN Code Login) -->
    <div id="loginSection" class="login-box">
        <h2>🔒 បញ្ចូលលេខកូដសម្ងាត់ម្ចាស់ហាង</h2>
        <input type="password" id="pinCode" class="form-control" placeholder="បញ្ចូលលេខកូដ PIN (ឧ. 8888)">
        <button class="btn" onclick="checkPin()">ចូលកាន់ប្រព័ន្ធ</button>
        <div id="errorMsg" class="error-msg">លេខកូដមិនត្រឹមត្រូវទេ!</div>
    </div>

    <!-- ប្រអប់គ្រប់គ្រងផ្ទាល់ខ្លួន ( Admin Panel ) -->
    <div id="adminSection" class="admin-container">
        <h2>⚙️ ប្រព័ន្ធគ្រប់គ្រងផ្ទាល់ខ្លួន</h2>
        
        <div class="card">
            <h3>📅 ការណាត់ជួបរបស់អតិថិជន</h3>
            <div id="bookingList" style="font-size: 13px; color: #adb5bd;">
                - គ្មានការណាត់ជួបថ្មីទេ (ទិន្នន័យនឹងបង្ហាញទីនេះ)
            </div>
        </div>

        <div class="card">
            <h3>📊 របាយការណ៍ការលក់ប្រចាំថ្ងៃ</h3>
            <div style="font-size: 13px; color: #adb5bd;">
                - ចំនួនលក់ថ្ងៃនេះ: <b>០ នាក់</b><br>
                - ចំណូលសរុប: <b>$0.00</b>
            </div>
        </div>
        
        <button class="btn" style="background: #e63946; color: #fff;" onclick="logout()">ចាកចេញ (Logout)</button>
    </div>

    <script>
        // កូដសម្ងាត់របស់បង (អាចប្ដូរលេខ 8888 តាមចិត្តចង់បាន)
        const MY_PIN = "8888";

        function checkPin() {
            let enteredPin = document.getElementById("pinCode").value;
            if (enteredPin === MY_PIN) {
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("adminSection").style.display = "block";
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        }

        function logout() {
            document.getElementById("adminSection").style.display = "none";
            document.getElementById("loginSection").style.display = "block";
            document.getElementById("pinCode").value = "";
            document.getElementById("errorMsg").style.display = "none";
        }
    </script>
</body>
</html>
