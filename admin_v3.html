<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KK Tire Cambodia - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Battambang', sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 15px; }
        .login-container { max-width: 400px; margin: 100px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .admin-container { max-width: 600px; margin: 0 auto; display: none; }
        h2 { font-size: 18px; margin-bottom: 15px; color: #1b263b; }
        .form-control, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ced4da; border-radius: 6px; font-family: 'Battambang', sans-serif; font-size: 13px; background: #fff; }
        .btn { width: 100%; background: #1b263b; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; font-family: 'Battambang', sans-serif; }
        .card { background: #fff; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card h3 { font-size: 15px; margin-bottom: 10px; color: #1b263b; }
        .error-msg { color: #d90429; font-size: 12px; margin-top: 5px; display: none; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 13px; }
        .item-row img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; margin-right: 10px; }
        .item-info { display: flex; align-items: center; }
        .btn-danger { background: #d90429; padding: 4px 8px; font-size: 11px; border-radius: 4px; color: #fff; border: none; cursor: pointer; }
        .preview-img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; display: none; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <!-- ផ្ទាំងផ្ទៀងផ្ទាត់កូដសម្ងាត់ -->
    <div id="loginSection" class="login-container">
        <h2>🔒 ចូលកាន់ប្រព័ន្ធ Admin</h2>
        <input type="password" id="pinCode" class="form-control" placeholder="បញ្ចូលលេខកូដ PIN (ឧ. 8888)">
        <button class="btn" onclick="checkPin()">ចូលប្រព័ន្ធ</button>
        <div id="errorMsg" class="error-msg">លេខកូដមិនត្រឹមត្រូវទេ!</div>
    </div>

    <!-- ផ្ទាំងគ្រប់គ្រង Admin Panel -->
    <div id="adminSection" class="admin-container">
        <h2 style="text-align: center; margin-bottom: 15px;">⚙️ ប្រព័ន្ធគ្រប់គ្រងហាង KK Tire</h2>
        
        <!-- ផ្នែកបន្ថែមទំនិញ -->
        <div class="card">
            <h3>➕ បន្ថែមទំនិញថ្មី</h3>
            
            <label style="font-size: 12px; color: #666;">ជ្រើសរើសប្រភេទ Menu៖</label>
            <select id="pCategory" class="form-control">
                <option value="moto-tire">សំបកកង់ម៉ូតូ</option>
                <option value="bike-tire">សំបកកង់កង់ធាក់</option>
                <option value="moto-tube">ពោះវៀនម៉ូតូ</option>
                <option value="bike-tube">ពោះវៀនកង់ធាក់</option>
                <option value="battery">អាគុយ</option>
                <option value="chain">ច្រវាក់ឈុត</option>
                <option value="brake">ប៉ាដាង</option>
                <option value="spark">ប៊ូស៊ី</option>
                <option value="oil">ប្រភេទដប</option>
                <option value="extra">ផលិតផលបន្ថែម</option>
            </select>

            <input type="text" id="pName" class="form-control" placeholder="ឈ្មោះទំនិញ (ឧ. Tubeless 100/90-14)">
            <input type="text" id="pFullPrice" class="form-control" placeholder="តម្លៃពេញ (ឧ. ៣០.០០ ដុល្លារ)">
            <input type="text" id="pNetPrice" class="form-control" placeholder="តម្លៃនេត (ឧ. ២៦.០០ ដុល្លារ)">
            
            <label style="font-size: 12px; color: #666;">ជ្រើសរើសរូបភាពពីទូរសព្ទ៖</label>
            <input type="file" id="pImageFile" class="form-control" accept="image/*" onchange="previewImage(event)">
            <img id="imgPreview" class="preview-img" alt="Preview">
            
            <button class="btn" onclick="addProduct()">រក្សាទុកទំនិញ</button>
        </div>

        <!-- បញ្ជីទំនិញដែលមានស្រាប់ -->
        <div class="card">
            <h3>📦 បញ្ជីទំនិញក្នុងស្តុក</h3>
            <div id="productList">
                <!-- ទិន្នន័យទំនិញនឹងបង្ហាញទីនេះ -->
            </div>
        </div>

        <!-- ការណាត់ជួប និងរបាយការណ៍ -->
        <div class="card">
            <h3>📅 ការណាត់ជួបរបស់អតិថិជន</h3>
            <p style="font-size: 13px; color: #666;">- គ្មានការណាត់ជួបថ្មីទេ</p>
        </div>

        <div class="card">
            <h3>📊 របាយការណ៍ការលក់ប្រចាំថ្ងៃ</h3>
            <p style="font-size: 13px; color: #666;">- ចំនួនលក់ថ្ងៃនេះ: <b>០ នាក់</b><br>- ចំណូលសរុប: <b>$0.00</b></p>
        </div>
        
        <button class="btn" style="background: #6c757d; margin-top: 10px;" onclick="logout()">ចាកចេញ (Logout)</button>
    </div>

    <script>
        const MY_PIN = "8888";
        let base64Image = "";

        function checkPin() {
            let enteredPin = document.getElementById("pinCode").value;
            if (enteredPin === MY_PIN) {
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("adminSection").style.display = "block";
                loadProducts();
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        }

        function logout() {
            document.getElementById("adminSection").style.display = "none";
            document.getElementById("loginSection").style.display = "block";
            document.getElementById("pinCode").value = "";
            document.getElementById("errorMsg").style.display = "none";
        }

        function previewImage(event) {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    let preview = document.getElementById("imgPreview");
                    preview.src = base64Image;
                    preview.style.display = "block";
                }
                reader.readAsDataURL(file);
            }
        }

        function loadProducts() {
            let listDiv = document.getElementById("productList");
            let products = JSON.parse(localStorage.getItem("kk_products")) || [
                {category: "moto-tire", name: "Tubeless 80/90-14", full: "២៥.០០ ដុល្លារ", net: "២១.០០ ដុល្លារ", image: ""}
            ];
            
            listDiv.innerHTML = "";
            products.forEach((p, index) => {
                let imgTag = p.image ? `<img src="${p.image}">` : `<div style="width:45px;height:45px;background:#eee;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;margin-right:10px;color:#888;">គ្មានរូប</div>`;
                listDiv.innerHTML += `
                    <div class="item-row">
                        <div class="item-info">
                            ${imgTag}
                            <div><b>[${p.category}]</b> ${p.name}<br><small>ពេញ: ${p.full} | នេត: ${p.net}</small></div>
                        </div>
                        <button class="btn-danger" onclick="deleteProduct(${index})">លុប</button>
                    </div>
                `;
            });
        }

        function addProduct() {
            let category = document.getElementById("pCategory").value;
            let name = document.getElementById("pName").value;
            let full = document.getElementById("pFullPrice").value;
            let net = document.getElementById("pNetPrice").value;

            if(!name || !full || !net) {
                alert("សូមបំពេញឈ្មោះ និងតម្លៃឱ្យបានគ្រប់គ្រាន់!");
                return;
            }

            let products = JSON.parse(localStorage.getItem("kk_products")) || [];

            products.push({category: category, name: name, full: full, net: net, image: base64Image});
            localStorage.setItem("kk_products", JSON.stringify(products));

            // Reset form
            document.getElementById("pName").value = "";
            document.getElementById("pFullPrice").value = "";
            document.getElementById("pNetPrice").value = "";
            document.getElementById("pImageFile").value = "";
            document.getElementById("imgPreview").style.display = "none";
            base64Image = "";
            
            loadProducts();
            alert("បានបន្ថែមទំនិញចូល Menu ដោយជោគជ័យ!");
        }

        function deleteProduct(index) {
            let products = JSON.parse(localStorage.getItem("kk_products"));
            products.splice(index, 1);
            localStorage.setItem("kk_products", JSON.stringify(products));
            loadProducts();
        }
    </script>
</body>
</html>
