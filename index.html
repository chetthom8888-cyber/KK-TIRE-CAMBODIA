<!-- Firebase Realtime Logic (Instant-Load Engine) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, get, runTransaction } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCwXn3viLY2dgPT74aygFI-MLK0YgbQ6Uo",
        authDomain: "kk-tire-shop.firebaseapp.com",
        projectId: "kk-tire-shop",
        storageBucket: "kk-tire-shop.firebasestorage.app",
        messagingSenderId: "436252946163",
        appId: "1:436252946163:web:af3fc96c3ff88e478b5186",
        measurementId: "G-TP2DFVJQZC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let tg = window.Telegram?.WebApp;
    if(tg) { try { tg.expand(); } catch(e) {} }

    let currentProduct = null, currentQty = 1, tempCoverImg = "", tempDetailImages = [], tempPromoPng = "", tempSloganPng = "", currentCategory = 'all';
    let globalProducts = [], globalPromos = [], globalSlogans = [];
    let displayLimit = 24, searchTimeout = null;

    // ⚡ ១. មុខងារ Compress រូបភាពឱ្យស្រាលបំផុត (WebP Quality 60%)
    function compressImage(file, maxWidth = 400, quality = 0.6) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/webp', quality));
                };
                img.onerror = () => resolve(e.target.result);
            };
        });
    }

    // ⚡ ២. INSTANT LOAD SYSTEM: ទាញទិន្នន័យពី Local Cache មកបង្ហាញលើអេក្រង់ភ្លាមៗ ០ វិនាទី
    function loadInitialCache() {
        try {
            const pCache = localStorage.getItem('kk_fast_products');
            const prCache = localStorage.getItem('kk_fast_promos');
            const slCache = localStorage.getItem('kk_fast_slogans');

            if (pCache) {
                globalProducts = JSON.parse(pCache);
                loadProducts('all', "");
            }
            if (prCache) {
                globalPromos = JSON.parse(prCache);
                renderPromosTicker();
            }
            if (slCache) {
                globalSlogans = JSON.parse(slCache);
                renderSlogansTicker();
            }
        } catch(e) {
            console.log("Cache bypass:", e);
        }
    }

    // ⚡ ៣. BACKGROUND SYNC: Sync ជាមួយ Firebase តាមក្រោយស្ងាត់ៗ
    async function syncDataFromFirebase() {
        try {
            // Fetch Products
            const pSnap = await get(ref(db, 'kk_shop/products'));
            if (pSnap.exists()) {
                const data = pSnap.val();
                globalProducts = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                
                // រក្សាទុកក្នុង Cache សម្រាប់ប្រើលើកក្រោយ
                try {
                    localStorage.setItem('kk_fast_products', JSON.stringify(globalProducts));
                } catch(e) {
                    // ប្រសិនបើ Cache ពេញ រក្សាទុកតែ ៦០ ទំនិញចុងក្រោយ
                    localStorage.setItem('kk_fast_products', JSON.stringify(globalProducts.slice(0, 60)));
                }
                loadProducts(currentCategory, document.getElementById("searchInput").value);
            }

            // Fetch Promos
            const prSnap = await get(ref(db, 'kk_shop/promos'));
            if (prSnap.exists()) {
                const data = prSnap.val();
                globalPromos = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
                localStorage.setItem('kk_fast_promos', JSON.stringify(globalPromos));
                renderPromosTicker();
            }

            // Fetch Slogans
            const slSnap = await get(ref(db, 'kk_shop/slogans'));
            if (slSnap.exists()) {
                const data = slSnap.val();
                globalSlogans = Object.keys(data).map(key => ({ ...data[key], firebaseKey: key }));
                localStorage.setItem('kk_fast_slogans', JSON.stringify(globalSlogans));
                renderSlogansTicker();
            }

            // Fetch Views
            const vSnap = await get(ref(db, 'kk_shop/stats/totalViews'));
            if (vSnap.exists()) {
                document.getElementById('totalAppViews').innerText = vSnap.val();
            }
        } catch(err) {
            console.log("Network sync error, using cache.");
        }
    }

    // ដំណើរការ Instant Load និង Background Sync ពេល App បើកភ្លាម
    loadInitialCache();
    syncDataFromFirebase();

    function renderPromosTicker() {
        let htmls = globalPromos.map(p => {
            let img = p.png ? `<img src="${p.png}" style="width:14px; height:14px; vertical-align:middle; margin-right:3px;" loading="lazy">` : "";
            return img + p.text;
        });
        document.getElementById("promoTextDisplay").innerHTML = htmls.length > 0 ? htmls.join(" &nbsp;&nbsp;&nbsp;⚡⚡⚡&nbsp;&nbsp;&nbsp; ") : "⚡ ហាងគ្រឿងបន្លាស់ម៉ូតូ KK Tire Cambodia ⚡";
    }

    let sloganIndex = 0;
    function renderSlogansTicker() {
        let container = document.getElementById('boycottBannerContainer');
        if(!container || globalSlogans.length === 0) return;
        container.innerHTML = "";
        globalSlogans.forEach((s, idx) => {
            let div = document.createElement('div');
            div.className = `slogan-slide ${idx === 0 ? 'active' : ''}`;
            let img = s.png ? `<img src="${s.png}" style="width:14px; height:14px; vertical-align:middle; margin-right:3px;" loading="lazy">` : "";
            div.innerHTML = img + s.text;
            container.appendChild(div);
        });
        if (globalSlogans.length > 1) {
            if (window.sloganTimer) clearInterval(window.sloganTimer);
            window.sloganTimer = setInterval(() => {
                let slides = container.querySelectorAll('.slogan-slide');
                if(slides.length === 0) return;
                slides[sloganIndex].classList.remove('active');
                sloganIndex = (sloganIndex + 1) % slides.length;
                slides[sloganIndex].classList.add('active');
            }, 6000);
        }
    }

    function formatPrice(val) {
        if (!val) return '';
        val = String(val).trim();
        return val.includes('$') ? val : val + '$';
    }

    function isProductNew(key) {
        let viewedList = JSON.parse(localStorage.getItem('kk_viewed_products') || '[]');
        return !viewedList.includes(key);
    }

    function createCardElement(p) {
        let isNew = isProductNew(p.firebaseKey);
        let card = document.createElement('div');
        card.className = 'product-card';
        card.onclick = () => handleProductClick(p.firebaseKey || '');

        let badgeHtml = isNew ? `<div class="new-badge">✨ ថ្មី</div>` : "";
        card.innerHTML = `
            ${badgeHtml}
            <img src="${p.coverImage || 'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=200'}" alt="${p.name}" loading="lazy" decoding="async">
            <div>
                <div class="product-title">${p.name}</div>
                <div class="price-view-row">
                    <span class="product-price">${formatPrice(p.full) || 'គ្មាន'}</span>
                    <span class="product-views-text">👁️ <span id="view-count-${p.firebaseKey}">${p.views || 0}</span></span>
                </div>
            </div>
        `;
        return card;
    }

    function loadProducts(category, q = "") {
        let grid = document.getElementById("productGrid");
        let popGrid = document.getElementById("popularHorizontalGrid");
        let newGrid = document.getElementById("newHorizontalGrid");
        if(!grid) return;
        
        grid.innerHTML = ""; popGrid.innerHTML = ""; newGrid.innerHTML = "";
        let popWrap = document.getElementById("popularSectionWrapper");
        let newWrap = document.getElementById("newSectionWrapper");

        if (category !== "all" || q.trim() !== "") {
            popWrap.style.display = "none"; newWrap.style.display = "none";
        } else {
            popWrap.style.display = "block"; newWrap.style.display = "block";
            
            let popFrag = document.createDocumentFragment();
            [...globalProducts].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 6).forEach(p => popFrag.appendChild(createCardElement(p)));
            popGrid.appendChild(popFrag);

            let newFrag = document.createDocumentFragment();
            [...globalProducts].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 6).forEach(p => newFrag.appendChild(createCardElement(p)));
            newGrid.appendChild(newFrag);
        }

        let filtered = category === "all" ? globalProducts : globalProducts.filter(p => p.category === category);
        if (q.trim() !== "") filtered = filtered.filter(p => p.name.toLowerCase().includes(q.toLowerCase().trim()));

        if (filtered.length === 0) {
            grid.innerHTML = `<p style="grid-column: span 4; text-align: center; color: #cbd5e1; font-size: 9px; padding: 10px;">រកមិនឃើញទំនិញទេ</p>`;
            return;
        }

        let gridFrag = document.createDocumentFragment();
        let visibleProducts = filtered.slice(0, displayLimit);
        
        visibleProducts.forEach(p => gridFrag.appendChild(createCardElement(p)));
        grid.appendChild(gridFrag);

        if (filtered.length > displayLimit) {
            let loadMoreBtn = document.createElement('button');
            loadMoreBtn.className = 'load-more-btn';
            loadMoreBtn.innerText = `🔄 បង្ហាញបន្ថែម (${filtered.length - displayLimit} ទៀត)`;
            loadMoreBtn.onclick = () => {
                displayLimit += 24;
                loadProducts(category, q);
            };
            grid.appendChild(loadMoreBtn);
        }
    }

    window.debouncedSearch = function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            displayLimit = 24;
            loadProducts(currentCategory, document.getElementById("searchInput").value);
        }, 100);
    };

    window.handleProductClick = function(key) {
        let p = globalProducts.find(item => item.firebaseKey === key);
        if (!p) return;
        currentProduct = p; currentQty = 1;

        let viewedList = JSON.parse(localStorage.getItem('kk_viewed_products') || '[]');
        if (!viewedList.includes(key)) {
            viewedList.push(key);
            localStorage.setItem('kk_viewed_products', JSON.stringify(viewedList));
        }

        p.views = (p.views || 0) + 1;
        let countEl = document.getElementById(`view-count-${key}`);
        if(countEl) countEl.innerText = p.views;

        // Sync view count ទៅ Firebase ស្ងាត់ៗ
        runTransaction(ref(db, `kk_shop/products/${key}/views`), (currentViews) => {
            return (currentViews || 0) + 1;
        });

        document.getElementById('modalTitle').innerText = p.name;
        document.getElementById('modalReg').innerText = formatPrice(p.full) || 'គ្មាន';
        document.getElementById('modalNet').innerText = formatPrice(p.net) || 'គ្មាន';
        document.getElementById('modalDesc').innerText = p.desc || 'គ្មានការរៀបរាប់';
        document.getElementById('orderQtyDisplay').innerText = currentQty;
        
        let mainImg = p.coverImage || '';
        document.getElementById('mainModalImg').src = mainImg;

        let thumbsContainer = document.getElementById('detailThumbsContainer');
        thumbsContainer.innerHTML = "";
        let allImgs = [mainImg, ...(p.detailImages || [])].filter(Boolean);
        
        let thumbFrag = document.createDocumentFragment();
        allImgs.forEach(imgUrl => {
            let imgEl = document.createElement('img');
            imgEl.src = imgUrl;
            imgEl.loading = "lazy";
            imgEl.onclick = () => document.getElementById('mainModalImg').src = imgUrl;
            thumbFrag.appendChild(imgEl);
        });
        thumbsContainer.appendChild(thumbFrag);

        updateOrderLink();
        document.getElementById('productModal').style.display = 'flex';
    };

    window.closeDetail = () => document.getElementById('productModal').style.display = 'none';
    window.adjustQty = (amt) => {
        currentQty = Math.max(1, currentQty + amt);
        document.getElementById('orderQtyDisplay').innerText = currentQty;
        updateOrderLink();
    };

    function updateOrderLink() {
        if(!currentProduct) return;
        let msg = `🛒 បញ្ជាទិញ:\n📦 ${currentProduct.name}\n💰 តម្លៃពេញ: ${formatPrice(currentProduct.full)}\n💰 តម្លៃនេត: ${formatPrice(currentProduct.net)}\n🔢 ចំនួន: ${currentQty}`;
        document.getElementById('modalOrderLink').href = `https://t.me/SameanMom168?text=` + encodeURIComponent(msg);
    }

    window.filterCategory = function(cat, el) {
        currentCategory = cat;
        displayLimit = 24;
        document.getElementById("searchInput").value = "";
        document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
        if(el) el.classList.add('active');
        document.getElementById('sectionTitle').innerText = cat === 'all' ? 'បញ្ជីគ្រឿងបន្លាស់ម៉ូតូទាំងអស់' : `ប្រភេទ: ${el.innerText}`;
        loadProducts(cat);
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    window.openGuideModal = () => document.getElementById('guideModal').style.display = 'flex';
    window.closeGuideModal = () => document.getElementById('guideModal').style.display = 'none';

    window.openAllPromosModal = function() {
        let c = document.getElementById('clientPromoListContainer');
        c.innerHTML = "";
        let frag = document.createDocumentFragment();
        globalPromos.forEach(p => {
            let div = document.createElement('div');
            div.style.cssText = "padding:5px 0; border-bottom:1px solid #e2e8f0;";
            let img = p.png ? `<img src="${p.png}" style="width:18px; height:18px; vertical-align:middle; margin-right:4px;" loading="lazy">` : "";
            div.innerHTML = `${img}<b>${p.text}</b>`;
            frag.appendChild(div);
        });
        c.appendChild(frag);
        document.getElementById('allPromosModal').style.display = 'flex';
    };
    window.closeAllPromosModal = () => document.getElementById('allPromosModal').style.display = 'none';

    window.openAllSlogansModal = function() {
        let c = document.getElementById('clientSloganListContainer');
        c.innerHTML = "";
        let frag = document.createDocumentFragment();
        globalSlogans.forEach(s => {
            let div = document.createElement('div');
            div.style.cssText = "padding:5px 0; border-bottom:1px solid #e2e8f0;";
            let img = s.png ? `<img src="${s.png}" style="width:18px; height:18px; vertical-align:middle; margin-right:4px;" loading="lazy">` : "";
            div.innerHTML = `${img}<b>${s.text}</b>`;
            frag.appendChild(div);
        });
        c.appendChild(frag);
        document.getElementById('allSlogansModal').style.display = 'flex';
    };
    window.closeAllSlogansModal = () => document.getElementById('allSlogansModal').style.display = 'none';

    window.openExchangeModal = () => document.getElementById('exchangeModal').style.display = 'flex';
    window.closeExchangeModal = () => document.getElementById('exchangeModal').style.display = 'none';

    window.openCalendarModal = () => {
        let d = new Date();
        let days = ['អាទិត្យ', 'ច័ន្ទ', 'អង្គារ', 'ពុធ', 'ព្រហស្បតិ៍', 'សុក្រ', 'សៅរ៍'];
        let months = ['មករា', 'កុម្ភៈ', 'មីនា', 'មេសា', 'ឧសភា', 'មិថុនា', 'កក្កដា', 'សីហា', 'កញ្ញា', 'តុលា', 'វិច្ឆិកា', 'ធ្នូ'];
        document.getElementById('khmerSolarDate').innerText = `ថ្ងៃ${days[d.getDay()]} ទី ${d.getDate()} ខែ ${months[d.getMonth()]} ឆ្នាំ ${d.getFullYear()}`;
        document.getElementById('khmerLunarDate').innerText = `ពុទ្ធសករាជ ២៥៧០, ឆ្នាំថោះ សប្តស័ក`;
        document.getElementById('calendarEventDesc').innerText = `• រដូវកាលនេះសាកសមបំផុតសម្រាប់ការថែទាំ និងប្តូរសំបកកង់ម៉ូតូថ្មីដើម្បីសុវត្ថិភាពក្នុងការធ្វើដំណើរ។\n• ហាងបើកទ្វារបម្រើសេវាកម្មជារៀងរាល់ថ្ងៃ!`;
        document.getElementById('calendarModal').style.display = 'flex';
    };
    window.closeCalendarModal = () => document.getElementById('calendarModal').style.display = 'none';

    window.openAdminLogin = function() {
        document.getElementById('adminModal').style.display = 'flex';
        loadAdminList();
        loadAdminPromoList();
        loadAdminSloganList();
    };
    window.closeAdmin = () => document.getElementById('adminModal').style.display = 'none';

    window.previewCover = async function(event) {
        let file = event.target.files[0];
        if (file) {
            tempCoverImg = await compressImage(file, 400, 0.6);
            document.getElementById('coverPreview').innerHTML = `<img src="${tempCoverImg}" style="width:30px; height:30px; object-fit:cover;">`;
        }
    };

    window.previewDetails = async function(event) {
        let files = event.target.files;
        tempDetailImages = [];
        let previewBox = document.getElementById('detailPreviews');
        previewBox.innerHTML = "";
        for (let file of files) {
            let compressed = await compressImage(file, 400, 0.6);
            tempDetailImages.push(compressed);
            previewBox.innerHTML += `<img src="${compressed}" style="width:30px; height:30px; object-fit:cover;">`;
        }
    };

    window.previewPromoPng = async function(event) {
        let file = event.target.files[0];
        if (file) {
            tempPromoPng = await compressImage(file, 120, 0.8);
            document.getElementById('promoPngPreview').innerHTML = `<img src="${tempPromoPng}" style="width:30px; height:30px; object-fit:contain;">`;
        }
    };

    window.previewSloganPng = async function(event) {
        let file = event.target.files[0];
        if (file) {
            tempSloganPng = await compressImage(file, 120, 0.8);
            document.getElementById('sloganPngPreview').innerHTML = `<img src="${tempSloganPng}" style="width:30px; height:30px; object-fit:contain;">`;
        }
    };

    window.saveProductData = function() {
        let editKey = document.getElementById('editIndex').value;
        let cat = document.getElementById('newCat').value;
        let name = document.getElementById('newName').value.trim();
        let full = document.getElementById('newFull').value.trim();
        let net = document.getElementById('newNet').value.trim();
        let desc = document.getElementById('newDesc').value.trim();

        if(!name || !full) { alert("សូមបំពេញឈ្មោះ និងតម្លៃពេញ!"); return; }

        let existing = editKey ? globalProducts.find(p => p.firebaseKey === editKey) : null;
        let productData = {
            category: cat, name: name, full: full, net: net, desc: desc,
            coverImage: tempCoverImg || (existing ? existing.coverImage : ''),
            detailImages: tempDetailImages.length > 0 ? tempDetailImages : (existing ? (existing.detailImages || []) : []),
            views: existing ? (existing.views || 0) : 0,
            createdAt: existing ? existing.createdAt : Date.now()
        };

        if (editKey) {
            set(ref(db, `kk_shop/products/${editKey}`), productData).then(() => {
                syncDataFromFirebase();
                resetProductForm();
                alert("កែប្រែទំនិញបានជោគជ័យ!");
            }).catch(err => alert("មានបញ្ហាក្នុងការរក្សាទុក៖ " + err.message));
        } else {
            let newRef = push(ref(db, 'kk_shop/products'));
            productData.firebaseKey = newRef.key;
            set(newRef, productData).then(() => {
                syncDataFromFirebase();
                resetProductForm();
                alert("រក្សាទុកទំនិញបានជោគជ័យ!");
            }).catch(err => alert("មានបញ្ហាក្នុងការរក្សាទុក៖ " + err.message));
        }
    };

    function loadAdminList() {
        let list = document.getElementById('adminProductList');
        if(!list) return;
        list.innerHTML = "";
        let selectedCat = document.getElementById('newCat').value;
        let filtered = globalProducts.filter(p => p.category === selectedCat);

        if (filtered.length === 0) {
            list.innerHTML = `<p style="font-size:8px; color:#64748b; text-align:center;">គ្មានទំនិញក្នុងប្រភេទនេះទេ</p>`;
            return;
        }

        let frag = document.createDocumentFragment();
        filtered.forEach(p => {
            let row = document.createElement('div');
            row.className = 'admin-list-row';
            row.innerHTML = `
                <img src="${p.coverImage || 'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=100'}" loading="lazy">
                <div style="flex-grow:1; margin-left:3px;"><b>${p.name}</b><br><span style="color:red;">${formatPrice(p.full)}</span></div>
                <button style="background:#0284c7; color:white; border:none; padding:3px 8px; border-radius:3px; cursor:pointer; margin-right:2px; font-weight:bold;">កែ</button>
                <button style="background:red; color:white; border:none; padding:3px 8px; border-radius:3px; cursor:pointer; font-weight:bold;">លុប</button>
            `;
            let btns = row.querySelectorAll('button');
            btns[0].onclick = () => editProd(p.firebaseKey || '');
            btns[1].onclick = () => deleteProd(p.firebaseKey || '');
            frag.appendChild(row);
        });
        list.appendChild(frag);
    }

    window.editProd = function(key) {
        let p = globalProducts.find(item => item.firebaseKey === key);
        if(!p) return;
        document.getElementById('editIndex').value = p.firebaseKey;
        document.getElementById('newCat').value = p.category;
        document.getElementById('newName').value = p.name;
        document.getElementById('newFull').value = p.full;
        document.getElementById('newNet').value = p.net || '';
        document.getElementById('newDesc').value = p.desc || '';
        tempCoverImg = p.coverImage || '';
        tempDetailImages = p.detailImages || [];
        document.getElementById('coverPreview').innerHTML = tempCoverImg ? `<img src="${tempCoverImg}" style="width:30px; height:30px; object-fit:cover;">` : '';
        document.getElementById('formHeaderTitle').innerText = "✏️ កែប្រែទំនិញ";
        document.getElementById('saveProductBtn').innerText = "💾 កែប្រែទំនិញ";
        document.getElementById('cancelEditBtn').style.display = "block";
        document.getElementById('adminContentContainer').scrollTop = 0;
    };

    window.resetProductForm = function() {
        document.getElementById('editIndex').value = "";
        document.getElementById('newName').value = "";
        document.getElementById('newFull').value = "";
        document.getElementById('newNet').value = "";
        document.getElementById('newDesc').value = "";
        document.getElementById('coverPreview').innerHTML = "";
        document.getElementById('detailPreviews').innerHTML = "";
        tempCoverImg = ""; tempDetailImages = [];
        document.getElementById('formHeaderTitle').innerText = "➕ បន្ថែមទំនិញថ្មី";
        document.getElementById('saveProductBtn').innerText = "💾 រក្សាទុកទំនិញ";
        document.getElementById('cancelEditBtn').style.display = "none";
        loadAdminList();
    };

    window.deleteProd = (key) => { 
        if(key && confirm("តើចង់លុបមែនទេ?")) {
            remove(ref(db, `kk_shop/products/${key}`)).then(() => syncDataFromFirebase());
        }
    };

    window.savePromoData = function() {
        let editKey = document.getElementById('editPromoKey').value;
        let text = document.getElementById('newPromoText').value.trim();
        if(!text) { alert("សូមបំពេញអត្ថបទ Promotion!"); return; }
        let existing = editKey ? globalPromos.find(p => p.firebaseKey === editKey) : null;
        let promoObj = { text: text, png: tempPromoPng || (existing ? existing.png : '') };

        const promoPromise = editKey ? set(ref(db, `kk_shop/promos/${editKey}`), promoObj) : set(push(ref(db, 'kk_shop/promos')), promoObj);
        promoPromise.then(() => {
            syncDataFromFirebase();
            resetPromoForm();
            alert("រក្សាទុក Promotion បានជោគជ័យ!");
        });
    };

    function loadAdminPromoList() {
        let list = document.getElementById('adminPromoList');
        if(!list) return;
        list.innerHTML = "";
        let frag = document.createDocumentFragment();
        globalPromos.forEach(p => {
            let img = p.png ? `<img src="${p.png}" loading="lazy">` : "";
            let row = document.createElement('div');
            row.className = 'admin-list-row';
            row.innerHTML = `
                ${img}
                <div style="flex-grow:1; overflow:hidden; text-overflow:ellipsis; margin-right:3px;">${p.text}</div>
                <button style="background:#0284c7; color:white; border:none; padding:2px; cursor:pointer; margin-right:2px;">កែ</button>
                <button style="background:red; color:white; border:none; padding:2px; cursor:pointer;">លុប</button>
            `;
            let btns = row.querySelectorAll('button');
            btns[0].onclick = () => editPromo(p.firebaseKey || '', p.text || '');
            btns[1].onclick = () => deletePromo(p.firebaseKey || '');
            frag.appendChild(row);
        });
        list.appendChild(frag);
    }

    window.editPromo = function(key, text) {
        let p = globalPromos.find(item => item.firebaseKey === key);
        document.getElementById('editPromoKey').value = key;
        document.getElementById('newPromoText').value = text;
        tempPromoPng = p ? p.png : '';

        document.getElementById('savePromoBtn').innerText = "💾 រក្សាទុក Promotion";
        document.getElementById('cancelPromoEditBtn').style.display = "none";

    };

    window.deletePromo = (key) => {

            remove(ref(db, `kk_shop/promos/${key}`)).then(() => syncDataFromFirebase());

    };

                <button style="background:#0284c7; color:white; border:none; padding:2px; cursor:pointer; margin-right:2px;">កែ</button>

    window.editSlogan = function(key, text) {

        document.getElementById('newSloganText').value = "";
        document.getElementById('sloganPngPreview').innerHTML = "";
        tempSloganPng = "";
        document.getElementById('saveSloganBtn').innerText = "💾 រក្សាទុកប្រយោគ";

    window.deleteSlogan = (key) => {
