    <!-- Firebase Realtime SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmE5ZFcr_RumLO9MmxJlbcomI",
            authDomain: "kk-tire-store.firebaseapp.com",
            databaseURL: "https://kk-tire-shop-default-rtdb.firebaseio.com",
            projectId: "kk-tire-store",
            storageBucket: "kk-tire-store.firebasestorage.app",
            messagingSenderId: "1011278846247",
            appId: "1:1011278846247:web:76b9385872600"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
            const dbRef = ref(db, 'kk_shop');

            window.dbRef = dbRef;
            window.setDb = set;

            // Real-time Listener
            onValue(dbRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    window.dbState = {
                        config: data.config || window.dbState.config,
                        promos: data.promos || [],
                        products: data.products || []
                    };
                }
                renderApp();
                if (document.getElementById('adminModal').style.display === 'flex') {
                    renderAdminPromoList();
                    renderAdminList();
                }
            }, (error) => {
                console.error("Firebase Error:", error);
            });
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        window.syncToFirebase = function() {
            if (window.dbRef && window.setDb) {
                window.setDb(window.dbRef, window.dbState).catch(err => {
                    alert("⚠️ សូមឆែក Firebase Rules របស់អ្នក! (Permission Denied)");
                });
            }
        };

        if (window.Telegram && window.Telegram.WebApp) {
            try {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            } catch(e){}
        }
    </script>

    <script>
        // 📌 Global Variables Baseline
        window.dbState = {
            config: { title: "ហាងគ្រឿងបន្លាស់ម៉ូតូ KK Tire", tg: "SameanMom168", about: "" },
            promos: [],
            products: []
        };
        window.viewedProductIds = JSON.parse(localStorage.getItem('kk_viewed_ids') || "[]");
        window.currentCat = 'all';
        window.tempCroppedImg = "";
        window.currentProduct = null;
        window.currentQty = 1;

        // 🔓 អនុគមន៍បើក Admin (ដោះស្រាយបញ្ហាចូលមិនបាន)
        function checkAndOpenAdmin() {
            const adminModal = document.getElementById('adminModal');
            if (!adminModal) return;

            document.getElementById('cfgTitle').value = window.dbState.config.title || "";
            document.getElementById('cfgTg').value = window.dbState.config.tg || "";
            document.getElementById('cfgAbout').value = window.dbState.config.about || "";

            renderAdminPromoList();
            renderAdminList();
            
            adminModal.style.display = 'flex';
        }

        function renderApp() {
            const dbState = window.dbState || {};
            document.getElementById('displayStoreTitle').innerText = dbState.config?.title || "ហាង KK Tire";
            document.getElementById('displayAboutText').innerText = dbState.config?.about || "";
            document.getElementById('pageTitle').innerText = dbState.config?.title || "ហាង KK Tire";

            const promoTextCombined = (dbState.promos || []).join(" &nbsp;&nbsp;&nbsp;⚡⚡⚡&nbsp;&nbsp;&nbsp; ");
            document.getElementById('displayPromoMarquee').innerHTML = promoTextCombined || "ស្វាគមន៍មកកាន់ហាងគ្រឿងបន្លាស់ម៉ូតូ!";
            
            let promoFullHtml = "";
            (dbState.promos || []).forEach((p, idx) => {
                promoFullHtml += `<div style="padding:4px 0; border-bottom:1px solid #334155;"><b>${idx + 1}.</b> ${p}</div>`;
            });
            document.getElementById('displayPromoFullList').innerHTML = promoFullHtml || "គ្មាន Promotion ទេ";

            const container = document.getElementById('productGridContainer');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            container.innerHTML = "";

            let list = [...(dbState.products || [])];
            if (search) list = list.filter(p => p.name.toLowerCase().includes(search));
            if (window.currentCat !== 'all') list = list.filter(p => p.category === window.currentCat);

            appendGridSection(container, "បញ្ជីទំនិញ", list);
        }

        function appendGridSection(container, title, list) {
            const secTitle = document.createElement('div');
            secTitle.className = 'section-title';
            secTitle.innerText = title;
            container.appendChild(secTitle);

            const grid = document.createElement('div');
            grid.className = 'grid';

            if(list.length === 0) {
                grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; font-size:10px; color:#94a3b8;">គ្មានទំនិញ</p>`;
                container.appendChild(grid);
                return;
            }

            const frag = document.createDocumentFragment();
            list.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openDetail(p.id);

                const isViewed = window.viewedProductIds.includes(p.id);
                const badgeHtml = (p.isNew && !isViewed) ? `<div class="badge-new">✨ ថ្មី</div>` : "";

                card.innerHTML = `
                    ${badgeHtml}
                    <img src="${p.img || 'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=200'}" loading="lazy">
                    <div class="card-title">${p.name}</div>
                    <div class="card-desc">${p.desc || 'គ្រឿងបន្លាស់គុណភាពខ្ពស់'}</div>
                    <div class="card-price">${p.priceFull || p.price || 'គ្មាន'}</div>
                `;
                frag.appendChild(card);
            });
            grid.appendChild(frag);
            container.appendChild(grid);
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const maxDim = 150; 
                    let width = img.width, height = img.height;

                    if (width > height) {
                        if (width > maxDim) { height *= maxDim / width; width = maxDim; }
                    } else {
                        if (height > maxDim) { width *= maxDim / height; height = maxDim; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    window.tempCroppedImg = canvas.toDataURL('image/jpeg', 0.3);
                    document.getElementById('pImgPreview').innerHTML = `<img src="${window.tempCroppedImg}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;">`;
                };
            };
        }

        function setCategory(cat, el) {
            window.currentCat = cat;
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            if(el) el.classList.add('active');
            renderApp();
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function openDetail(id) {
            const p = window.dbState.products.find(i => i.id === id);
            if(!p) return;
            window.currentProduct = p;
            window.currentQty = 1;

            if (!window.viewedProductIds.includes(p.id)) {
                window.viewedProductIds.push(p.id);
                localStorage.setItem('kk_viewed_ids', JSON.stringify(window.viewedProductIds));
                renderApp();
            }

            document.getElementById('mImg').src = p.img || 'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=200';
            document.getElementById('mTitle').innerText = p.name;
            document.getElementById('mPriceFull').innerText = p.priceFull || p.price || 'គ្មាន';
            document.getElementById('mPriceNet').innerText = p.priceNet || 'គ្មាន';
            document.getElementById('mDesc').innerText = p.desc || '';
            document.getElementById('mQty').innerText = window.currentQty;
            
            updateOrderLink();
            openModal('productModal');
        }

        function adjustQty(amt) {
            window.currentQty = Math.max(1, window.currentQty + amt);
            document.getElementById('mQty').innerText = window.currentQty;
            updateOrderLink();
        }

        function updateOrderLink() {
            if(!window.currentProduct) return;
            const msg = `🛒 បញ្ជាទិញ:\n📦 ${window.currentProduct.name}\n💰 តម្លៃពេញ: ${window.currentProduct.priceFull || window.currentProduct.price}\n💰 តម្លៃនេត: ${window.currentProduct.priceNet || 'គ្មាន'}\n🔢 ចំនួន: ${window.currentQty}`;
            document.getElementById('mOrderBtn').href = `https://t.me/${window.dbState.config.tg || 'SameanMom168'}?text=` + encodeURIComponent(msg);
        }

        function saveConfig() {
            window.dbState.config.title = document.getElementById('cfgTitle').value.trim() || window.dbState.config.title;
            window.dbState.config.tg = document.getElementById('cfgTg').value.trim() || window.dbState.config.tg;
            window.dbState.config.about = document.getElementById('cfgAbout').value.trim() || window.dbState.config.about;
            window.syncToFirebase();
            alert("💾 រក្សាទុកជោគជ័យ!");
        }

        function addPromoText() {
            const val = document.getElementById('newPromoInput').value.trim();
            if(!val) return;
            if(!window.dbState.promos) window.dbState.promos = [];
            window.dbState.promos.push(val);
            document.getElementById('newPromoInput').value = "";
            window.syncToFirebase();
            renderAdminPromoList();
        }

        function deletePromoText(idx) {
            if(confirm("តើចង់លុប Promotion នេះមែនទេ?")) {
                window.dbState.promos.splice(idx, 1);
                window.syncToFirebase();
                renderAdminPromoList();
            }
        }

        function renderAdminPromoList() {
            const box = document.getElementById('adminPromoList');
            if(!box) return;
            box.innerHTML = "";
            (window.dbState.promos || []).forEach((p, idx) => {
                const row = document.createElement('div');
                row.className = 'admin-row';
                row.innerHTML = `
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px;">${p}</span>
                    <button class="btn-sm" style="background:#ef4444" onclick="deletePromoText(${idx})">លុប</button>
                `;
                box.appendChild(row);
            });
        }

        function renderAdminList() {
            const box = document.getElementById('adminProductList');
            if(!box) return;
            box.innerHTML = "";
            let list = [...(window.dbState.products || [])];

            if (list.length === 0) {
                box.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:5px;">គ្មានទំនិញ</div>`;
                return;
            }

            list.forEach(p => {
                const row = document.createElement('div');
                row.className = 'admin-row';
                row.innerHTML = `
                    <span><b>${p.name}</b> (${p.priceFull || p.price})</span>
                    <div>
                        <button class="btn-sm" style="background:#0284c7" onclick="editProd('${p.id}')">កែ</button>
                        <button class="btn-sm" style="background:#ef4444" onclick="deleteProd('${p.id}')">លុប</button>
                    </div>
                `;
                box.appendChild(row);
            });
        }

        function saveProduct() {
            const editId = document.getElementById('pEditId').value;
            const name = document.getElementById('pName').value.trim();
            const priceFull = document.getElementById('pPriceFull').value.trim();
            const priceNet = document.getElementById('pPriceNet').value.trim();
            const cat = document.getElementById('pCat').value;
            const desc = document.getElementById('pDesc').value.trim();

            if(!name || !priceFull) { alert("សូមបំពេញឈ្មោះ និងតម្លៃពេញ!"); return; }

            if(!window.dbState.products) window.dbState.products = [];
            const existing = editId ? window.dbState.products.find(p => p.id === editId) : null;
            const imgUrl = window.tempCroppedImg || (existing ? existing.img : '');

            if(editId) {
                const idx = window.dbState.products.findIndex(p => p.id === editId);
                if(idx !== -1) window.dbState.products[idx] = { ...window.dbState.products[idx], category: cat, name: name, priceFull: priceFull, priceNet: priceNet, img: imgUrl, desc: desc };
            } else {
                window.dbState.products.unshift({ id: Date.now().toString(), category: cat, name: name, priceFull: priceFull, priceNet: priceNet, img: imgUrl, desc: desc, views: 0, isNew: true });
            }

            resetProductForm();
            window.syncToFirebase();
            renderAdminList();
            alert("💾 រក្សាទុកទំនិញ និង Sync ជោគជ័យ!");
        }

        function editProd(id) {
            const p = window.dbState.products.find(i => i.id === id);
            if(!p) return;
            document.getElementById('pEditId').value = p.id;
            document.getElementById('pCat').value = p.category;
            document.getElementById('pName').value = p.name;
            document.getElementById('pPriceFull').value = p.priceFull || p.price || '';
            document.getElementById('pPriceNet').value = p.priceNet || '';
            document.getElementById('pDesc').value = p.desc || '';
            window.tempCroppedImg = p.img || '';
            document.getElementById('pImgPreview').innerHTML = window.tempCroppedImg ? `<img src="${window.tempCroppedImg}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;">` : '';
        }

        function resetProductForm() {
            document.getElementById('pEditId').value = "";
            document.getElementById('pName').value = "";
            document.getElementById('pPriceFull').value = "";
            document.getElementById('pPriceNet').value = "";
            document.getElementById('pFileInput').value = "";
            document.getElementById('pDesc').value = "";
            document.getElementById('pImgPreview').innerHTML = "";
            window.tempCroppedImg = "";
        }

        function deleteProd(id) {
            if(confirm("តើចង់លុបមែនទេ?")) {
                window.dbState.products = window.dbState.products.filter(p => p.id !== id);
                window.syncToFirebase();
                renderAdminList();
            }
        }
    </script>
